services:
  # -------------------------------------------------------------
  # Servicio 1: Motor de Base de Datos PostgreSQL 16
  # -------------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_template
    restart: always
    environment:
      POSTGRES_DB: esports_tournament_db
      POSTGRES_USER: admin_torneo
      POSTGRES_PASSWORD: TuPasswordSeguro2026!
      TZ: America/Mazatlan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - db_network

  # -------------------------------------------------------------
  # Servicio 2: Administrador Web pgAdmin 4 (Modo Servidor)
  # -------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_template
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uabcs.mx
      PGADMIN_DEFAULT_PASSWORD: AdminPgPass2026!
      PGADMIN_CONFIG_SERVER_MODE: 'True' # Habilita inicio de sesión multiusuario
    ports:
      - "80:80" # Render detectará el puerto 80 HTTP inmediatamente
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - db_network
    depends_on:
      - postgres_db

# -------------------------------------------------------------
# Volúmenes Persistentes y Redes Internas
# -------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local

networks:
  db_network:
    driver: bridge